[project]
name = "tissue-classifier"
version = "2.0.0"
description = "Single-sample v2.0 cross-architecture (2x RealMLP + 2x TabM) tissue-of-origin classification and Top-3 SHAP waterfall clinical PDF reporting"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pytabkit==1.7.3",
    "torch==2.14.1",
    "pytorch-lightning==2.6.6",
    "shap==0.52.0",
    "matplotlib==3.11.2",
    "seaborn>=0.13",
    "numpy",
    "pandas",
    "scipy",
    "pyarrow",
    "scikit-learn",
    "joblib",
    "pyliftover>=0.4",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pytest",
]

[project.scripts]
tissue-classifier = "tissue_classifier.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tissue_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
